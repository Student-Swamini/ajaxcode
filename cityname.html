<!DOCTYPE html>
<html>
<head>
    <title>City Search</title>
</head>
<body>

<h2>Search City</h2>

<input type="text" id="city" onkeyup="searchCity()">

<p id="result"></p>

<script>
function searchCity() {

    var city = document.getElementById("city").value;

    var xhttp = new XMLHttpRequest();

    xhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
            document.getElementById("result").innerHTML =
                this.responseText;
        }
    };

    xhttp.open("GET", "cityname.php?city=" + city, true);
    xhttp.send();
}
</script>

</body>
</html>
