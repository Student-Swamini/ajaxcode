<html>

<body>

<button onclick="display()">
    Load Employees
</button>

<h3 id="show"></h3>

<script>

function display()
{
    var x = new XMLHttpRequest();

    x.open("GET", "employee.json", true);

    x.send();

    x.onreadystatechange = function()
    {
        if (x.readyState == 4 && x.status == 200)
        {
            document.getElementById("show").innerHTML =
                x.responseText;
        }
    };
}

</script>

</body>
</html>
